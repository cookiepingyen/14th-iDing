# production 環境啟動指令: export RAILS_MASTER_KEY="secret" && docker compose up --build
version: '3'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iding_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "54320:5432"

  web:
    image: pingyenwu/14th-iding:latest
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/iding_development
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
